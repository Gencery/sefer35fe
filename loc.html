<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"
    href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🚍&lt;/text&gt;&lt;/svg&gt;">
  <title>Sefer35</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    #map {
      height: 480px;
    }

    .leaflet-bottom.leaflet-right {
      display: none;
    }
  </style>
</head>

<body>
  <header>
  </header>
  <main>
    <div id="map"></div>
  </main>
  <script>
    // initialize the map on the "map" div with a given center and zoom
    var map = L.map('map').setView([38.44, 27.25], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    fetch("./Assets/duraklar_505.json")
      .then(res => res.json())
      .then(data => {

        data.forEach(item => {

          let coord = [item.Enlem, item.Boylam];
          coord = coord.map(item => item.replace(",", "."));

          L.marker(coord, {
            icon: L.divIcon({
              html: `${item.DurakId} - ${item.Adi}`,
              iconSize: "auto"
            })
          }).addTo(map);
        })
      })

    fetch("https://openapi.izmir.bel.tr/api/iztek/hatotobuskonumlari/505")
      .then(res => res.json())
      .then(data => {

        data.HatOtobusKonumlari.filter(item => item.Yon == 0).forEach(item => {

          let coord = [item.KoorX, item.KoorY];
          coord = coord.map(item => item.replace(",", "."));

          L.marker(coord).addTo(map)
        })
      })

    fetch("./Assets/path_505.json")
      .then(res => res.json())
      .then(data => {

        data = data.map(item => {
          return item.map(coordPnt => parseFloat(coordPnt)).reverse()
        })
        // 2. Create the line with custom styles and add it to the map
        var polyline = L.polyline(data, {
          color: 'red',
          weight: 3,
          opacity: 0.7,
          smoothFactor: 1
        }).addTo(map);

      })


  </script>
  <script>
    function calcDistOfTwoPnts(pnt1, pnt2) {
      return Math.sqrt(Math.pow(pnt1.x - pnt2.x, 2) + Math.pow(pnt1.y - pnt2.y, 2))
    }


    setTimeout(async () => {
      let stations = await fetch("./Assets/duraklar_505_sade.json")
        .then(res => res.json());

      let busPositions = await fetch("https://openapi.izmir.bel.tr/api/iztek/hatotobuskonumlari/505")
        .then(res => res.json())
        .then(data => data.HatOtobusKonumlari.filter(item => item.Yon == 0).map(item => {
          return {
            ...item,
            KoorX: parseFloat(item.KoorX.replace(",", ".")),
            KoorY: parseFloat(item.KoorY.replace(",", "."))
          }
        }));

      let closestBusStationsPerBus = [];


      for (let busPosition of busPositions) {
        let index = busPositions.indexOf(busPosition);
        let smallestDistance = [stations[0].adi, calcDistOfTwoPnts({ x: busPosition.KoorX, y: busPosition.KoorY }, stations[0])];

        for (let station of stations) {
          let distance = calcDistOfTwoPnts({ x: busPosition.KoorX, y: busPosition.KoorY }, station);
          if (smallestDistance[1] > distance) {
            smallestDistance = [station.adi, distance];
            closestBusStationsPerBus[index] = (smallestDistance);
          }
        }
      }

      console.log(closestBusStationsPerBus.filter(item => item[1] < 0.005).map(item => [item[0], parseInt(item[1] * 111000)]));
    }, 1000)




  </script>
</body>

</html>
